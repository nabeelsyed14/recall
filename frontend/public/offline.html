<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recall — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #F8F7FF 0%, #FFFFFF 50%, #F3E8FF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      background: #fff;
      border-radius: 32px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.1);
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .offline-icon {
      font-size: 48px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
    }
    p {
      color: #6B7280;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      background: linear-gradient(to bottom, #8B5CF6 0%, #7C3AED 100%);
      color: #fff;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
      transition: all 0.3s ease;
    }
    .btn:hover { transform: translateY(-3px); }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>Recall needs a connection to sync your knowledge. Check your network and try again.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
